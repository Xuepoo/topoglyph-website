{% set prefix = scope %}
<div class="controls-grid" style="margin-top: 16px">
  <div class="field">
    <label for="{{ prefix }}opt-charset">Charset</label>
    <select
      id="{{ prefix }}opt-charset"
      class="charset-select"
      data-scope="{{ prefix }}"
    >
      <option value="lines" selected>Lines (built-in, no font needed)</option>
      <option value="ascii">ASCII (needs a font)</option>
      <option value="blocks">Blocks (needs a font)</option>
      <option value="braille">Braille (needs a font)</option>
      <option value="custom">Custom characters (needs a font)</option>
    </select>
  </div>
  <div
    class="field custom-chars-field"
    data-scope="{{ prefix }}"
    style="display: none"
  >
    <label for="{{ prefix }}opt-custom-chars">Custom Characters</label>
    <input
      type="text"
      id="{{ prefix }}opt-custom-chars"
      placeholder="e.g. 水火木金土 or repeat chars to weight them"
    />
  </div>
  <div class="field font-field" data-scope="{{ prefix }}" style="display: none">
    <label for="{{ prefix }}opt-font"
      >Font File (TTF/OTF) &mdash; <strong>required</strong> for this
      charset</label
    >
    <input type="file" id="{{ prefix }}opt-font" accept=".ttf,.otf" />
    <p class="field-hint">
      Every character in this charset is rasterized from the font you upload
      here (there is no built-in font). Any system TTF/OTF works &mdash; e.g. on
      Windows try
      <code>C:\Windows\Fonts\consola.ttf</code>, on macOS
      <code>/System/Library/Fonts/Menlo.ttc</code>, on Linux
      <code>/usr/share/fonts/**/*.ttf</code>.
    </p>
  </div>
  <div
    class="field glyph-mode-field"
    data-scope="{{ prefix }}"
    style="display: none"
  >
    <label for="{{ prefix }}opt-glyph-mode">Glyph Mode</label>
    <select id="{{ prefix }}opt-glyph-mode">
      <option value="set" selected>Set (equal weight)</option>
      <option value="weighted">Weighted (by frequency)</option>
    </select>
  </div>
</div>

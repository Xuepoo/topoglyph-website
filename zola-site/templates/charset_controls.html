{% set prefix = scope %}
<div class="controls-grid" style="margin-top: 16px">
  <div class="field">
    <label for="{{ prefix }}opt-charset">{{ trans(key="charset_label", lang=lang) | safe }}</label>
    <select
      id="{{ prefix }}opt-charset"
      class="charset-select"
      data-scope="{{ prefix }}"
    >
      <option value="lines" selected>{{ trans(key="charset_lines", lang=lang) | safe }}</option>
      <option value="ascii">{{ trans(key="charset_ascii", lang=lang) | safe }}</option>
      <option value="blocks">{{ trans(key="charset_blocks", lang=lang) | safe }}</option>
      <option value="braille">{{ trans(key="charset_braille", lang=lang) | safe }}</option>
      <option value="custom">{{ trans(key="charset_custom", lang=lang) | safe }}</option>
    </select>
  </div>
  <div
    class="field custom-chars-field"
    data-scope="{{ prefix }}"
    style="display: none"
  >
    <label for="{{ prefix }}opt-custom-chars"
      >{{ trans(key="custom_chars_label", lang=lang) | safe }}</label
    >
    <input
      type="text"
      id="{{ prefix }}opt-custom-chars"
      placeholder="{{ trans(key="custom_chars_placeholder", lang=lang) | safe }}"
    />
  </div>
  <div class="field font-field" data-scope="{{ prefix }}" style="display: none">
    <label for="{{ prefix }}opt-font"
      >{{ trans(key="font_label", lang=lang) | safe }}</label
    >
    <input type="file" id="{{ prefix }}opt-font" accept=".ttf,.otf" />
    <p class="field-hint">{{ trans(key="font_hint", lang=lang) | safe }}</p>
  </div>
  <div
    class="field glyph-mode-field"
    data-scope="{{ prefix }}"
    style="display: none"
  >
    <label for="{{ prefix }}opt-glyph-mode"
      >{{ trans(key="glyph_mode_label", lang=lang) | safe }}</label
    >
    <select id="{{ prefix }}opt-glyph-mode">
      <option value="set" selected>{{ trans(key="glyph_mode_set", lang=lang) | safe }}</option>
      <option value="weighted">{{ trans(key="glyph_mode_weighted", lang=lang) | safe }}</option>
    </select>
  </div>
</div>

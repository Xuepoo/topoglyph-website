name: Deploy Web

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout topoglyph-website
        uses: actions/checkout@v4.1.7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # topoglyph-core/-atlas/-output/-vectomancy are pinned to their
      # published crates.io releases in wasm-engine/Cargo.toml (not a
      # `path = "../../topoglyph/..."` dependency), so there is no sibling
      # repo to clone here -- unlike vectomancy-web's own deploy workflow,
      # which still needs `git clone .../vectomancy ../vectomancy` because
      # its wasm-engine uses path dependencies.
      - name: Build WASM Engine
        run: |
          cd wasm-engine
          wasm-pack build --target web --out-dir ../zola-site/static/wasm

      - name: Install Zola
        run: |
          ZOLA_VERSION="0.22.1"
          curl -L -o zola.tar.gz https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf zola.tar.gz
          sudo mv zola /usr/local/bin/

      - name: Build Zola site
        run: |
          cd zola-site
          zola build

      - name: Deploy to Cloudflare Pages
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        if: ${{ env.CF_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy zola-site/public --project-name=topoglyph --branch=main

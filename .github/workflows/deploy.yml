name: Deploy Web

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# One deploy per ref: a newer push supersedes an in-flight run for the same
# branch/PR, but production (main) and previews never cancel each other.
concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    # Job-level env so the deploy steps' `if:` conditions can actually read
    # it: a step's own `env:` block is applied *after* its `if:` is evaluated,
    # which silently made the old single-step check a no-op.
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout topoglyph-website
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # topoglyph-core/-atlas/-output/-vectomancy are pinned to their
      # published crates.io releases in wasm-engine/Cargo.toml (not a
      # `path = "../../topoglyph/..."` dependency), so there is no sibling
      # repo to clone here -- unlike vectomancy-web's own deploy workflow,
      # which still needs `git clone .../vectomancy ../vectomancy` because
      # its wasm-engine uses path dependencies.
      - name: Build WASM Engine
        run: |
          cd wasm-engine
          wasm-pack build --target web --out-dir ../zola-site/static/wasm

      - name: Install Zola
        run: |
          ZOLA_VERSION="0.22.1"
          curl -L -o zola.tar.gz https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf zola.tar.gz
          sudo mv zola /usr/local/bin/

      - name: Build Zola site
        run: |
          cd zola-site
          zola build

      # Production: only pushes to main (or a manual run on main). Cloudflare
      # Pages treats `--branch=main` as the production branch.
      - name: Deploy to Cloudflare Pages (production)
        if: ${{ env.CF_API_TOKEN != '' && github.ref == 'refs/heads/main' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy zola-site/public --project-name=topoglyph --branch=main

      # Pull requests get a preview deployment on a per-branch alias instead of
      # overwriting production, so a PR can no longer ship unreviewed changes
      # to https://topoglyph.xuepoo.xyz.
      - name: Deploy to Cloudflare Pages (preview)
        if: ${{ env.CF_API_TOKEN != '' && github.event_name == 'pull_request' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy zola-site/public --project-name=topoglyph --branch=${{ github.head_ref }}
